<div class="field"><label for="state-filter">State</label><select id="state-filter" name="state"><option value="">All states + Washington, D.C.</option>{% for code, name in states %}<option value="{{ code }}" {% if state == code %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div><div class="field"><label for="city-search">City or community</label><input id="city-search" name="q" type="search" maxlength="80" value="{{ area_query }}" placeholder="For example, Austin" autocomplete="off" aria-describedby="area-search-status"></div><p id="area-search-status" class="field-help" role="status" aria-live="polite">Choose a state and type a city. Up to 40 matches are shown at a time.</p>
