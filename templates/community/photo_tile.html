<a class="photo-tile" href="{% url 'community_photo' photo.pk %}"><div class="photo-tile-image"><img src="{% url 'community_photo_image' photo.pk %}" alt="{{ photo.image_description }}" loading="lazy" width="{{ photo.width }}" height="{{ photo.height }}">{% if photo.status == 'pending' %}<span class="badge">Awaiting approval · Only you</span>{% endif %}</div><div class="photo-tile-copy"><h3>{{ photo.title }}</h3><p>Shared by {{ photo.uploader_name }}</p></div></a>
